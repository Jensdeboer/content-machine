<helmet><link rel="stylesheet" href="../01-tokens/tokens.css"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;1,300&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:var(--pv-color-line);-webkit-font-smoothing:antialiased}a{color:var(--pv-color-accent)}a:hover{color:var(--pv-color-ink)}</style></helmet>
<div style="padding:32px;display:flex;flex-direction:column;gap:24px;font-family:var(--pv-font-body);color:var(--pv-color-ink)">

  </div>
  <div style="display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:var(--pv-space-16)">

      <p style="margin:0;font-family:var(--pv-font-data);font-weight:var(--pv-weight-data);font-size:11px;letter-spacing:.04em;color:var(--pv-color-accent-ink)">NAVY · 320 AND 40</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--pv-space-16)">
      <div style="display:flex;align-items:flex-end;gap:var(--pv-space-32)"><div style="width:320px;height:320px;border-radius:50%;background:var(--pv-color-ground);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px var(--pv-color-line)"><svg viewBox="0 0 100 100" width="198" height="198" fill="var(--pv-color-accent-ink)"><rect x="20" y="16" width="15" height="68" fill="var(--pv-color-mute)"></rect><polygon points="35,16 66,16 88,38 66,60 35,60 35,45 60,45 67,38 60,31 35,31"></polygon></svg></div><div style="width:40px;height:40px;border-radius:50%;background:var(--pv-color-ground);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px var(--pv-color-line)"><svg viewBox="0 0 100 100" width="25" height="25" fill="var(--pv-color-accent-ink)"><rect x="20" y="16" width="15" height="68" fill="var(--pv-color-mute)"></rect><polygon points="35,16 66,16 88,38 66,60 35,60 35,45 60,45 67,38 60,31 35,31"></polygon></svg></div></div>

  </div>
</div>
